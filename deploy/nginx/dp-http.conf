# dp.ondralinek.cz — HTTP-only static preview, used until the TLS certificate
# exists. deploy/deploy.sh swaps this for dp.conf after issuing the certificate.
#
# Static only: this file deliberately has no proxy_pass. The Go backend on
# 127.0.0.1:8090 is not reachable through this domain.
#
# Source of truth: https://github.com/ondrej-li/DropPulse/tree/main/deploy

# A static page is one request. The burst absorbs a typed URL plus the favicon;
# anything above that is a script. Unique zone names keep this vhost safe to
# enable alongside dp.conf by mistake.
limit_req_zone  $binary_remote_addr zone=dp_http_req:10m  rate=1r/s;
limit_conn_zone $binary_remote_addr zone=dp_http_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name dp.ondralinek.cz;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    root /var/www/dp;
    index index.html;
    charset utf-8;

    # Very deliberately small: 1 request/second per IP, five in a burst, and
    # three concurrent streams. This is stricter than the shared edge because
    # the public site is a placeholder.
    limit_req  zone=dp_http_req burst=5 nodelay;
    limit_conn dp_http_conn 3;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/dp.access.log;
    error_log  /var/log/nginx/dp.error.log;

    # Plain HTTP headers only: HSTS and upgrade-insecure-requests belong to the
    # TLS vhost and would break the site while it is still served over HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json image/svg+xml;

    # Let's Encrypt validates through this path, so it must never redirect or
    # be rewritten. The shared rate limit still applies; one validation request
    # is well inside the burst.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dp;
        default_type "text/plain";
    }

    # The Go backend is not part of this domain. Keep the API and health check
    # answered here rather than letting a future location accidentally proxy
    # them.
    location ^~ /api/ {
        return 404;
    }
    location = /healthz {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;  # -> Cache-Control: no-cache
    }
}
