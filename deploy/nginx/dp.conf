# dp.ondralinek.cz — the public pages, the app and its loopback API.
# Installed as /etc/nginx/sites-available/dp by deploy/deploy.sh or by
# `sudo vps-site vhost install dp deploy/nginx/dp.conf` from the agent account.
#
# The static pages stay in /var/www/dp and keep the strict read-only policy.
# /app/ and /api/ are the only proxied paths; both go to the Go backend on
# loopback. There is no generic proxy and no user-controlled upstream.
#
# Source of truth: https://github.com/ondrej-li/DropPulse/tree/main/deploy

# A static page is one request. The burst absorbs a typed URL plus the favicon;
# anything above that is a script. Unique zone names keep this vhost safe to
# enable alongside dp-http.conf by mistake.
limit_req_zone  $binary_remote_addr zone=dp_tls_req:10m  rate=1r/s;
limit_conn_zone $binary_remote_addr zone=dp_tls_conn:10m;

# The app is not one static request: it fetches the provider list, the current
# account and the watch list on load, and POSTs/DELETEs as the user works. This
# is a separate, still-small zone; the static pages above stay at 1 r/s.
limit_req_zone  $binary_remote_addr zone=dp_app_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dp_app_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name dp.ondralinek.cz;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    limit_req  zone=dp_tls_req burst=5 nodelay;
    limit_conn dp_tls_conn 3;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/dp.access.log;
    error_log  /var/log/nginx/dp.error.log;

    # Let's Encrypt renews through this path, so it must never be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dp;
        default_type "text/plain";
    }

    location / {
        return 301 https://dp.ondralinek.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dp.ondralinek.cz;

    # Scanner drops are server-wide and use regex locations. The exact /app/
    # location and the ^~ /api/ prefix below take precedence over them, so a
    # JSON path that happens to look like a probe is still the backend's.
    include snippets/block-scanner-paths.conf;

    root /var/www/dp;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/dp.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dp.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The static pages keep the original 1 r/s floor. The app locations
    # override this with the wider zone below.
    limit_req  zone=dp_tls_req burst=5 nodelay;
    limit_conn dp_tls_conn 3;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/dp.access.log;
    error_log  /var/log/nginx/dp.error.log;

    # Includes HSTS, the static CSP and the full header set. A location that
    # adds headers of its own does not inherit these, so the two proxied
    # locations repeat the subset that the backend does not send.
    include /etc/nginx/snippets/dp-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json image/svg+xml;

    # A typed /app should land on the app, not on the static 404.
    location = /app {
        return 301 /app/;
    }

    # The app is one self-contained HTML page. The backend sets its own CSP
    # (inline script allowed) and Cache-Control: no-store; nginx must not
    # apply the static page's script-src 'none' policy here.
    location = /app/ {
        limit_req  zone=dp_app_req burst=20 nodelay;
        limit_conn dp_app_conn 10;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # The API. Read/write methods are deliberate here: the backend enforces
    # its own methods, CSRF and Origin checks, and the app cannot work without
    # POST and DELETE. The static pages remain read-only below.
    location ^~ /api/ {
        limit_req  zone=dp_app_req burst=20 nodelay;
        limit_conn dp_app_conn 10;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # The health check stays local to the service; it is not a public probe.
    location = /healthz {
        return 404;
    }

    # The explicit read-only policy lives here, not at server level: the API
    # deliberately needs POST and DELETE, and an `if` at server level cannot
    # be undone inside a location.
    location / {
        include snippets/methods-read-only.conf;
        try_files $uri $uri/ =404;
    }

    # Custom 404 page for missing static resources.
    error_page 404 /404.html;

    location = /404.html {
        include snippets/methods-read-only.conf;
        internal;
    }

    location = /index.html {
        include snippets/methods-read-only.conf;
        expires -1;  # -> Cache-Control: no-cache
    }
}
