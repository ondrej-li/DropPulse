# Security headers for dp.ondralinek.cz (HTTPS).
#
# add_header does not accumulate across levels: a location that sets any header
# drops the ones inherited from the server block, so include this file in every
# location that adds headers of its own.

add_header Strict-Transport-Security    "max-age=31536000" always;
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# The page is one self-contained HTML file with inline CSS, a data-URI favicon
# and no JavaScript. Nothing is loaded from a third party, so the policy can
# deny everything else outright.
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
