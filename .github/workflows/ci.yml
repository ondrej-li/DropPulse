name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The VPS is arm64 and has no Go 1.27 toolchain, so the binary that runs
      # there has to be built by CI. Keep the artifact short-lived; it is a
      # deployment input, not a release.
      - name: Build Linux arm64 binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/droppulse-server ./cmd/server

      - name: Upload Linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: droppulse-server-linux-arm64
          path: backend/bin/droppulse-server
          if-no-files-found: error
          retention-days: 7
